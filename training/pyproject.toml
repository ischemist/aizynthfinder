[project]
name = "aizynth-single-step-training"
version = "0.1.0"
description = "standalone training tools for aizynthfinder-compatible template expansion policies"
readme = "README.md"
authors = [
    { name = "Anton Morgunov", email = "anton@ischemist.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "rdchiral>=1.1.0",
    "rdkit>=2023.9",
    "reaction-utils>=1.9.3",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "tensorflow>=2.15,<2.21",
]
cuda = [
    "tensorflow[and-cuda]>=2.15,<2.21; platform_system == 'Linux'",
]

[project.scripts]
aizynth-train-one-step = "aizynth_single_step_training.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"
